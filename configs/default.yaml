run:
  name: default
  output_root: runs
  random_seed: 20261027
  active_sku_count: 150
  source: uci_online_retail_ii
  source_file: data/raw/online_retail_ii.zip
  source_sheet: Year 2010-2011

split:
  train: 0.60
  validation: 0.20
  test: 0.20
  route_sample_size: 300

warehouse:
  aisle_count: 7
  racks_per_aisle: 2
  bays_per_rack: 5
  levels_per_bay: 4
  aisle_spacing_m: 4.0
  bay_pitch_m: 1.2
  shelf_level_pitch_m: 0.9
  front_cross_aisle_y_m: 0.0
  rear_cross_aisle_y_m: 7.2
  depot_aisle: 0
  depot_y_m: 0.0
  zone_aisles:
    STANDARD: [0, 1, 2, 3]
    MEDICAL: [4]
    FIRE: [5]
    HAZMAT: [6]

rules:
  usable_volume_fraction: 0.90
  heavy_unit_weight_kg: 8.0
  heavy_allowed_levels: [0, 1]
  golden_zone_levels: [1, 2]
  high_risk_levels: [3]
  hazardous_zone: HAZMAT
  fragile_forbidden_levels: [3]
  category_zones:
    normal: STANDARD
    fragile: STANDARD
    medical: MEDICAL
    fire: FIRE
    hazardous: HAZMAT
  category_allowed_levels:
    normal: [0, 1, 2, 3]
    fragile: [0, 1, 2]
    medical: [0, 1, 2]
    fire: [0, 1, 2]
    hazardous: [0, 1, 2]
  category_separation_rules:
    - categories: [medical, normal]
      min_clearance_m: 2.0
    - categories: [medical, fragile]
      min_clearance_m: 2.0
    - categories: [fire, normal]
      min_clearance_m: 2.0
    - categories: [fire, fragile]
      min_clearance_m: 2.0
    - categories: [fire, medical]
      min_clearance_m: 2.0
    - categories: [hazardous, normal]
      min_clearance_m: 2.0
    - categories: [hazardous, fragile]
      min_clearance_m: 2.0
    - categories: [hazardous, medical]
      min_clearance_m: 2.0
    - categories: [hazardous, fire]
      min_clearance_m: 2.0
  hazard_min_clearance_m: 2.0
  base_pick_seconds: 4.0
  seconds_per_unit: 0.2
  walking_speed_mps: 1.2
  reach_penalty_seconds:
    "0": 1.5
    "1": 0.0
    "2": 0.0
    "3": 2.5

baseline:
  primary_seed: 481516
  restarts: 10

optimizer:
  seed: 516234
  max_proposals: 10000
  time_limit_seconds: 60
  checkpoint_count: 5
  weights:
    depot: 0.50
    affinity: 0.30
    ergonomics: 0.15
    occupied_capacity: 0.05
  affinity:
    min_cooccurrence: 3
    neighbors_per_sku: 10

